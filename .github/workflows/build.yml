name: Build installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macOS
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: Windows
            args: ""
            rust_targets: ""
            bundle: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      # whisper.cpp for local transcription, bundled next to the program ("sidecar").
      - uses: actions/cache@v4
        id: whisper
        with:
          path: src-tauri/binaries
          key: whisper-v1.9.5-${{ matrix.os }}-4
      - name: "Build whisper-cli (Mac: Apple Silicon with Metal + Intel with AVX2, joined into one file)"
        if: matrix.name == 'macOS' && steps.whisper.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp ../wcpp
          common="-DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_SDL2=OFF -DGGML_NATIVE=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          cmake -S ../wcpp -B ../warm $common -DCMAKE_OSX_ARCHITECTURES=arm64 -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON
          cmake --build ../warm --config Release --target whisper-cli -j 4
          # Intel Macs: Metal on AMD/Intel graphics is slower than the processor, so CPU with AVX2/FMA instead.
          cmake -S ../wcpp -B ../wx86 $common -DCMAKE_OSX_ARCHITECTURES=x86_64 -DGGML_METAL=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON
          cmake --build ../wx86 --config Release --target whisper-cli -j 4
          mkdir -p src-tauri/binaries
          lipo -create ../warm/bin/whisper-cli ../wx86/bin/whisper-cli -output src-tauri/binaries/whisper-cli-universal-apple-darwin
          cp ../warm/bin/whisper-cli src-tauri/binaries/whisper-cli-aarch64-apple-darwin
          cp ../wx86/bin/whisper-cli src-tauri/binaries/whisper-cli-x86_64-apple-darwin
          lipo -info src-tauri/binaries/whisper-cli-universal-apple-darwin
      - name: Build whisper-cli (Windows)
        if: matrix.name == 'Windows' && steps.whisper.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp ../wcpp
          cmake -S ../wcpp -B ../wbuild -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_SDL2=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build ../wbuild --config Release --target whisper-cli -j 4
          mkdir -p src-tauri/binaries
          cp ../wbuild/bin/Release/whisper-cli.exe src-tauri/binaries/whisper-cli-x86_64-pc-windows-msvc.exe
      - name: Check transcription works (tiny model, sample recording)
        if: matrix.name == 'macOS'
        run: |
          curl -L --fail -sS -o /tmp/tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          echo "bd577a113a864445d4c299885e0cb97d4ba92b5f  /tmp/tiny.bin" | shasum -c
          curl -L --fail -sS -o /tmp/jfk.wav https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.9.5/samples/jfk.wav
          src-tauri/binaries/whisper-cli-universal-apple-darwin -m /tmp/tiny.bin -f /tmp/jfk.wav -l auto -ng | tee /tmp/out.txt
          grep -qi "country" /tmp/out.txt
          # The Intel half, through Rosetta if this runner has it.
          if arch -x86_64 /usr/bin/true 2>/dev/null; then arch -x86_64 src-tauri/binaries/whisper-cli-universal-apple-darwin -m /tmp/tiny.bin -f /tmp/jfk.wav -l auto -bs 1 -bo 1 | tee /tmp/out86.txt; grep -qi "country" /tmp/out86.txt; fi
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Encryption tests must pass before any installer is built.
      # (the window is built first: the engine embeds it even in tests)
      # Known vulnerabilities in libraries (Linux-only GTK warnings are not used on Mac/Windows).
      - uses: taiki-e/install-action@cargo-audit
        if: matrix.name == 'macOS'
      - run: cargo audit --file src-tauri/Cargo.lock
        if: matrix.name == 'macOS'
      - run: npm audit --omit=dev
        if: matrix.name == 'macOS'
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: QDA-${{ matrix.name }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
