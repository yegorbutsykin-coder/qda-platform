name: Probe macOS runners
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15, macos-26, macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: sw_vers; uname -m
